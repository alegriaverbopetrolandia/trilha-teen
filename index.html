<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Trilha Teen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#4f46e5; --pri2:#6366f1; --pri-claro:#eef2ff;
  --bg:#f6f7fb; --card:#ffffff; --txt:#1f2337; --txt2:#5b6178; --linha:#e6e8f0;
  --ok:#16a34a; --ok-claro:#dcfce7; --alerta:#d97706; --alerta-claro:#fef3c7; --perigo:#dc2626; --perigo-claro:#fee2e2;
  --e1:#2563eb; --e2:#16a34a; --e3:#ea580c; --e4:#9333ea;
  --raio:16px; --sombra:0 1px 2px rgba(20,24,60,.06),0 6px 20px rgba(20,24,60,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#11131c; --card:#1a1d2a; --txt:#eceefa; --txt2:#a3a8c3; --linha:#2b2f42; --pri-claro:#24264a; --ok-claro:#12301f; --alerta-claro:#3a2a0c; --perigo-claro:#3b1515; }
}
:root[data-theme="dark"]{ --bg:#11131c; --card:#1a1d2a; --txt:#eceefa; --txt2:#a3a8c3; --linha:#2b2f42; --pri-claro:#24264a; --ok-claro:#12301f; --alerta-claro:#3a2a0c; --perigo-claro:#3b1515; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Nunito',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em}
.esconde{display:none!important}

/* layout */
#app{display:flex;min-height:100vh;background:linear-gradient(to right,var(--card) 250px,var(--bg) 250px)}
@media (max-width:860px){#app{background:var(--bg)}}
#lateral{width:250px;flex-shrink:0;background:var(--card);border-right:1px solid var(--linha);position:sticky;top:0;height:100vh;overflow:auto;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.marca{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.marca .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--pri),#a855f7);display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px;flex-shrink:0}
.marca b{display:block;font-size:17px;font-weight:900}
.marca small{display:block;color:var(--txt2);font-size:12px;line-height:1.2}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--txt2);font-weight:700;border:0;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--pri-claro);color:var(--txt)}
.nav-item.ativo{background:var(--pri);color:#fff}
.nav-item svg{width:20px;height:20px;flex-shrink:0}
.nav-item .bolha{margin-left:auto;background:var(--perigo);color:#fff;border-radius:99px;font-size:12px;padding:0 7px;min-width:22px;text-align:center}
.nav-item.ativo .bolha{background:#fff;color:var(--perigo)}
.nav-sep{height:1px;background:var(--linha);margin:8px 6px}
#principal{flex:1;min-width:0;padding:24px 28px 100px}
.topo{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topo h1{font-size:26px;font-weight:900;margin:0;flex:1;min-width:200px}
.topo .sub{color:var(--txt2);font-size:14px;width:100%;margin-top:-6px}
#barra-mobile{display:none}
#demo-faixa{background:#fde68a;color:#78350f;font-size:13px;text-align:center;padding:6px 10px;font-weight:700}

@media (max-width:860px){
  #lateral{display:none}
  #principal{padding:16px 16px 96px}
  #barra-mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--linha);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  #barra-mobile button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--txt2);padding:4px 0;position:relative}
  #barra-mobile button svg{width:22px;height:22px}
  #barra-mobile button.ativo{color:var(--pri)}
  #barra-mobile .bolha{position:absolute;top:0;right:calc(50% - 20px);background:var(--perigo);color:#fff;border-radius:99px;font-size:10px;padding:0 5px}
  .topo h1{font-size:22px}
}

/* componentes */
.card{background:var(--card);border-radius:var(--raio);box-shadow:var(--sombra);padding:18px;border:1px solid var(--linha)}
.grade{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;background:var(--pri);color:#fff;font-size:15px;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.btn.sec{background:var(--pri-claro);color:var(--pri)}
.btn.linha{background:transparent;border:1.5px solid var(--linha);color:var(--txt)}
.btn.zap{background:#25d366;color:#fff}
.btn.perigo{background:var(--perigo-claro);color:var(--perigo)}
.btn.peq{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.icone{padding:8px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .n{font-size:30px;font-weight:900;line-height:1.1}
.kpi .r{color:var(--txt2);font-size:13px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:800;background:var(--pri-claro);color:var(--pri);white-space:nowrap}
.chip.ok{background:var(--ok-claro);color:var(--ok)}
.chip.alerta{background:var(--alerta-claro);color:var(--alerta)}
.chip.perigo{background:var(--perigo-claro);color:var(--perigo)}
.chip.cinza{background:var(--linha);color:var(--txt2)}
.muted{color:var(--txt2)}
.peq{font-size:13px}
.lista{display:flex;flex-direction:column}
.lin{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--linha)}
.lin:last-child{border-bottom:0}
.lin .info{flex:1;min-width:0}
.lin .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lin .info span{color:var(--txt2);font-size:13px}
@media (max-width:640px){
  .lin{flex-wrap:wrap;row-gap:8px}
  .lin .info{flex:1 1 calc(100% - 56px);min-width:0}
  .lin .info b{white-space:normal}
  .lin>.btn,.lin>.chip{flex:0 0 auto}
  .lin>.avatar+.info~.btn:first-of-type{margin-left:52px}
}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;flex-shrink:0;font-size:15px}
.campo{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.campo label{font-size:13px;font-weight:800;color:var(--txt2)}
.campo small{color:var(--txt2);font-size:12px}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=date],input[type=number],select,textarea{width:100%;border:1.5px solid var(--linha);background:var(--card);border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
textarea{min-height:90px;resize:vertical;line-height:1.45}
textarea.grande{min-height:260px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.busca{position:relative;flex:1;min-width:180px}
.busca input{padding-left:38px}
.busca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--txt2)}
.abas{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.abas button{border:0;background:var(--card);border:1px solid var(--linha);padding:8px 14px;border-radius:99px;font-weight:800;cursor:pointer;white-space:nowrap;color:var(--txt2)}
.abas button.ativo{background:var(--pri);color:#fff;border-color:var(--pri)}
.vazio{text-align:center;padding:30px 10px;color:var(--txt2)}
.vazio svg{width:44px;height:44px;opacity:.5;margin-bottom:6px}
.secao-t{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--txt2);margin:22px 0 10px}

/* lições */
.eixo-banda{border-radius:var(--raio);padding:18px;color:#fff;margin:22px 0 12px;position:relative;overflow:hidden}
.eixo-banda h2{font-size:20px;font-weight:900;margin:0}
.eixo-banda p{margin:4px 0 0;opacity:.92;font-size:14px}
.licao-card{display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:transform .1s}
.licao-card:hover{transform:translateY(-1px)}
.licao-card .num{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#fff;flex-shrink:0;font-size:17px}
.licao-card .t{font-weight:800;line-height:1.3}
.licao-card .d{font-size:13px;color:var(--txt2)}
.licao-card.hoje{outline:3px solid var(--alerta)}
.md h2{font-size:19px;font-weight:900;margin:22px 0 8px;color:var(--pri)}
.md h3{font-size:17px;font-weight:900;margin:16px 0 6px}
.md p{margin:0 0 10px}
.md ul,.md ol{margin:0 0 12px;padding-left:22px}
.md li{margin-bottom:4px}
.md blockquote{margin:10px 0;padding:10px 14px;border-left:4px solid var(--pri);background:var(--pri-claro);border-radius:0 12px 12px 0}
.versiculo{background:linear-gradient(135deg,var(--pri),#7c3aed);color:#fff;border-radius:var(--raio);padding:18px 20px}
.versiculo p{font-size:18px;font-weight:700;margin:0 0 6px;line-height:1.45}
.versiculo small{opacity:.9;font-weight:800}
.mini-slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mini-slide{aspect-ratio:16/9;border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
.mini-slide .sl{transform:scale(.25);transform-origin:top left;width:400%;height:400%;pointer-events:none}

/* slides projetor */
#projetor{position:fixed;inset:0;z-index:100;background:#0b0d18;display:flex;flex-direction:column}
#projetor .palco{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#projetor .sl{width:100%;height:100%}
#projetor .controles{position:absolute;top:14px;right:14px;display:flex;justify-content:flex-end;flex-wrap:wrap;gap:10px;opacity:.25;transition:opacity .2s}
#projetor:hover .controles{opacity:1}
#projetor .controles button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:99px;padding:10px 16px;font-weight:800;cursor:pointer;backdrop-filter:blur(6px)}
.sl{display:flex;flex-direction:column;justify-content:center;padding:6vh 8vw;color:#fff;position:relative;background:var(--slbg,linear-gradient(135deg,#312e81,#6d28d9));font-family:'Nunito',sans-serif}
.sl .rod{position:absolute;bottom:3.5vh;left:8vw;right:8vw;display:flex;justify-content:space-between;font-size:max(12px,1.6vh);opacity:.75;font-weight:700}
.sl h1{font-size:max(26px,7.5vh);font-weight:900;margin:0 0 2vh;line-height:1.1}
.sl h2{font-size:max(18px,4.2vh);font-weight:700;margin:0;opacity:.92;line-height:1.25}
.sl ul{list-style:none;padding:0;margin:1vh 0 0}
.sl li{font-size:max(17px,4.3vh);font-weight:700;margin:0 0 1.8vh;padding-left:5vh;position:relative;line-height:1.25}
.sl li:before{content:'';position:absolute;left:0;top:1.3vh;width:2.2vh;height:2.2vh;border-radius:50%;background:rgba(255,255,255,.85)}
.sl.capa{text-align:center;align-items:center}
.sl.capa h1{font-size:max(32px,10vh)}
.sl.vers{text-align:center;align-items:center}
.sl.vers .txt{font-size:max(20px,5.6vh);font-weight:800;line-height:1.35;max-width:85%}
.sl.vers .txt:before{content:'“';display:block;font-size:max(50px,14vh);line-height:.6;opacity:.5}
.sl.vers .ref{margin-top:3vh;font-size:max(15px,3.4vh);font-weight:800;opacity:.85}
.sl.perg{text-align:center;align-items:center}
.sl.perg .q{font-size:max(46px,16vh);font-weight:900;line-height:1;opacity:.35}
.sl.perg h1{font-size:max(26px,7vh);max-width:85%}

/* modal */
#modal-fundo{position:fixed;inset:0;background:rgba(10,12,30,.55);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
#modal{background:var(--card);border-radius:20px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:92vh}
#modal.largo{max-width:960px}
#modal .mt{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--linha)}
#modal .mt h3{flex:1;margin:0;font-size:19px;font-weight:900}
#modal .mc{padding:18px;overflow:auto}
#modal .mr{padding:14px 18px;border-top:1px solid var(--linha);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1f2337;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:120;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.erro{background:var(--perigo)}
#carregando{position:fixed;inset:0;background:rgba(246,247,251,.6);z-index:130;display:grid;place-items:center}
.spin{width:42px;height:42px;border:4px solid var(--pri-claro);border-top-color:var(--pri);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* chamada */
.ch-lin{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--linha)}
.ch-lin .info{flex:1;min-width:0}
.pfj{display:flex;gap:6px}
.pfj button{width:44px;height:40px;border-radius:10px;border:1.5px solid var(--linha);background:var(--card);font-weight:900;cursor:pointer;color:var(--txt2)}
.pfj button.on-P{background:var(--ok);border-color:var(--ok);color:#fff}
.pfj button.on-F{background:var(--perigo);border-color:var(--perigo);color:#fff}
.pfj button.on-J{background:var(--alerta);border-color:var(--alerta);color:#fff}

/* barras */
.barras{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.barras .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.barras .b i{display:block;width:100%;max-width:34px;background:var(--pri);border-radius:6px 6px 2px 2px;min-height:3px}
.barras .b span{font-size:11px;color:var(--txt2);font-weight:700;white-space:nowrap}
.barras .b em{font-style:normal;font-size:11px;font-weight:800}
.progresso{height:8px;background:var(--linha);border-radius:99px;overflow:hidden;min-width:60px}
.progresso i{display:block;height:100%;background:var(--ok);border-radius:99px}
table.tab{width:100%;border-collapse:collapse;font-size:14px}
table.tab th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--txt2);padding:8px 6px;border-bottom:1px solid var(--linha);white-space:nowrap}
table.tab td{padding:10px 6px;border-bottom:1px solid var(--linha);vertical-align:middle}
.rolagem-x{overflow-x:auto}

/* tarefa (aluno) */
.questao{padding:14px 0;border-bottom:1px solid var(--linha)}
.questao:last-child{border-bottom:0}
.questao .en{font-weight:800;margin-bottom:8px}
.opcao{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--linha);border-radius:12px;margin-bottom:6px;cursor:pointer}
.opcao input{width:18px;height:18px;accent-color:var(--pri)}
.opcao.certa{border-color:var(--ok);background:var(--ok-claro)}
.opcao.errada{border-color:var(--perigo);background:var(--perigo-claro)}
.selo{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:14px;text-align:center;background:var(--pri-claro)}
.selo .ic{font-size:30px;line-height:1}
.selo b{font-size:13px}
.selo.off{filter:grayscale(1);opacity:.45}
.estrelas button{background:none;border:0;font-size:28px;cursor:pointer;padding:0 2px;color:#d1d5db}
.estrelas button.on{color:#f59e0b}

/* login */
.login-fundo{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#c7d2fe 0,transparent 40%),radial-gradient(circle at 80% 90%,#e9d5ff 0,transparent 40%),var(--bg)}
.login-box{width:100%;max-width:420px}
.login-box .marca{justify-content:center;flex-direction:column;text-align:center;padding-bottom:20px}
.login-box .marca .logo{width:64px;height:64px;font-size:28px;border-radius:18px}
.login-box .marca b{font-size:26px}
</style>
</head>

/* ---------- comunicação com o servidor ---------- */
function chamar(acao,dados,silencioso){
  if(!silencioso) carregando(true);
  return new Promise(function(ok,falha){
    var fim=function(txt){
      if(!silencioso) carregando(false);
      var r; try{r=JSON.parse(txt);}catch(e){r={ok:false,erro:'Resposta inválida do servidor.'};}
      if(r.ok) ok(r.r); else { toast(r.erro,true); if(/Sessão expirada|PIN inválido|Código inválido/.test(r.erro)){guardar('tt_bio',null);sair();} falha(new Error(r.erro)); }
    };
    var credJ=JSON.stringify(S.cred), dadosJ=JSON.stringify(dados||{});
    if(API_URL&&/^https?:/.test(API_URL)){
      fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({acao:acao,dados:dados||{},cred:S.cred})})
        .then(function(r){return r.text();}).then(fim)
        .catch(function(e){fim(JSON.stringify({ok:false,erro:'Sem conexão com o servidor. Verifique a internet e tente de novo.'}));});
    } else if(window.google&&google.script&&google.script.run){
      google.script.run.withSuccessHandler(fim).withFailureHandler(function(e){fim(JSON.stringify({ok:false,erro:'Falha de conexão: '+(e&&e.message||e)}));}).apiWeb(acao,dadosJ,credJ);
    } else if(window.DEMO_API){
      setTimeout(function(){fim(DEMO_API(acao,dadosJ,credJ));},120);
    } else fim(JSON.stringify({ok:false,erro:'Esta igreja ainda não está ligada ao servidor: falta colar o link do Apps Script na lista IGREJAS do arquivo index.html ('+IGREJA+').'}));
  });
}

/* ---------- markdown simples ---------- */
function md(t){
  var linhas=String(t||'').split(/\r?\n/), out=[], lista=null, olN=0;
  function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g,'$1<i>$2</i>');}
  function fecha(){if(lista){out.push('</'+lista+'>');lista=null;}}
  linhas.forEach(function(l){
    var m;
    if(/^\s*$/.test(l)){fecha();return;}
    if((m=l.match(/^###\s+(.*)/))){fecha();olN=0;out.push('<h3>'+inl(m[1])+'</h3>');return;}
    if((m=l.match(/^##\s+(.*)/))){fecha();olN=0;out.push('<h2>'+inl(m[1])+'</h2>');return;}
    if((m=l.match(/^#\s+(.*)/))){fecha();out.push('<h2>'+inl(m[1])+'</h2>');return;}
    if((m=l.match(/^\s*[-•]\s+(.*)/))){if(lista!=='ul'){fecha();out.push('<ul>');lista='ul';}out.push('<li>'+inl(m[1])+'</li>');return;}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){if(lista!=='ol'){fecha();out.push('<ol start="'+(olN+1)+'">');lista='ol';}olN++;out.push('<li>'+inl(m[1])+'</li>');return;}
    if((m=l.match(/^>\s?(.*)/))){fecha();out.push('<blockquote>'+inl(m[1])+'</blockquote>');return;}
    fecha();olN=0;out.push('<p>'+inl(l)+'</p>');
  });
  fecha();return out.join('');
}

/* ---------- tarefa ---------- */
function parseTarefa(txt){
  var out={desafio:'',questoes:[]},atual=null;
  String(txt||'').split(/\r?\n/).forEach(function(linha){
    var l=linha.trim(); if(!l)return;
    if(/^DESAFIO:/i.test(l)){out.desafio=l.replace(/^DESAFIO:\s*/i,'');atual=null;return;}
    if(l.indexOf('??')===0){atual={tipo:'aberta',enunciado:l.slice(2).trim()};out.questoes.push(atual);return;}
    if(l.charAt(0)==='?'){atual={tipo:'mc',enunciado:l.slice(1).trim(),opcoes:[],correta:-1};out.questoes.push(atual);return;}
    if(atual&&atual.tipo==='mc'&&(l.charAt(0)==='*'||l.charAt(0)==='-')){if(l.charAt(0)==='*')atual.correta=atual.opcoes.length;atual.opcoes.push(l.slice(1).trim());return;}
    if(atual)atual.enunciado+=' '+l;else out.desafio+=(out.desafio?' ':'')+l;
  });
  return out;
}

/* ---------- slides ---------- */
function parseSlides(txt){
  return String(txt||'').split(/\n\s*---\s*\n/).map(function(b){
    var s={titulo:'',sub:'',itens:[],vers:'',ref:'',perg:false};
    b.split(/\r?\n/).forEach(function(l){
      var t=l.trim(),m; if(!t)return;
      if((m=t.match(/^#\s*\?\s*(.*)/))){s.perg=true;s.titulo=m[1];return;}
      if((m=t.match(/^##\s+(.*)/))){s.sub=m[1];return;}
      if((m=t.match(/^#\s+(.*)/))){s.titulo=m[1];return;}
      if((m=t.match(/^>\s?(.*)/))){s.vers+=(s.vers?' ':'')+m[1];return;}
      if((m=t.match(/^[—–-]{1,2}\s+(.*)/))&&s.vers&&!s.itens.length&&/\d/.test(m[1])&&t.charAt(0)!=='-'){s.ref=m[1];return;}
      if((m=t.match(/^[-•]\s+(.*)/))){s.itens.push(m[1]);return;}
      if((m=t.match(/^[—–]\s*(.*)/))){s.ref=m[1];return;}
      s.itens.push(t);
    });
    return s;
  }).filter(function(s){return s.titulo||s.vers||s.itens.length;});
}
function slideHTML(s,i,total,lic){
  var bg=EIXO_GRAD[lic&&lic.eixo]||EIXO_GRAD[1];
  var rod='<div class="rod"><span>'+esc((S.d&&S.d.config.nomeApp)||'')+(lic?' · '+esc(lic.titulo):'')+'</span><span>'+(i+1)+' / '+total+'</span></div>';
  var c='';
  if(s.vers){c='<div class="txt">'+esc(s.vers)+'</div>'+(s.ref?'<div class="ref">'+esc(s.ref)+'</div>':'');return '<div class="sl vers" style="--slbg:'+bg+'">'+c+rod+'</div>';}
  if(s.perg){return '<div class="sl perg" style="--slbg:'+bg+'"><div class="q">?</div><h1>'+esc(s.titulo)+'</h1>'+(s.sub?'<h2>'+esc(s.sub)+'</h2>':'')+rod+'</div>';}
  var capa=i===0&&!s.itens.length;
  c='<h1>'+esc(s.titulo)+'</h1>'+(s.sub?'<h2>'+esc(s.sub)+'</h2>':'');
  if(s.itens.length)c+='<ul>'+s.itens.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  return '<div class="sl'+(capa?' capa':'')+'" style="--slbg:'+bg+'">'+c+rod+'</div>';
}
var PJ={sl:[],i:0,lic:null};
function projetar(texto,lic,inicio){
  PJ.sl=parseSlides(texto);PJ.i=inicio||0;PJ.lic=lic;
  if(!PJ.sl.length){toast('Esta lição ainda não tem slides.',true);return;}
  var d=document.createElement('div');d.id='projetor';
  d.innerHTML='<div class="palco" id="pj-palco"></div><div class="controles"><button onclick="pjIr(-1)">◀ Anterior</button><button onclick="pjTela()">⛶ Tela cheia</button><button onclick="pjFechar()">✕ Sair</button><button onclick="pjIr(1)">Próximo ▶</button></div>';
  document.body.appendChild(d);
  var x0=null;d.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;});
  d.addEventListener('touchend',function(e){if(x0==null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)pjIr(dx<0?1:-1);x0=null;});
  d.querySelector('.palco').addEventListener('click',function(e){var w=window.innerWidth;pjIr(e.clientX>w/3?1:-1);});
  document.addEventListener('keydown',pjTecla);
  pjMostra();
}
function pjMostra(){$('#pj-palco').innerHTML=slideHTML(PJ.sl[PJ.i],PJ.i,PJ.sl.length,PJ.lic);}
function pjIr(n){PJ.i=Math.max(0,Math.min(PJ.sl.length-1,PJ.i+n));pjMostra();}
function pjTecla(e){if(!$('#projetor'))return;if(['ArrowRight','PageDown',' '].indexOf(e.key)>=0){e.preventDefault();pjIr(1);}if(['ArrowLeft','PageUp'].indexOf(e.key)>=0){e.preventDefault();pjIr(-1);}if(e.key==='Escape')pjFechar();}
function pjTela(){var el=$('#projetor');try{if(!document.fullscreenElement)el.requestFullscreen();else document.exitFullscreen();}catch(e){toast('Use F11 para tela cheia neste navegador.');}}

function statsAluno(a){
  var pr=presDe(a.id),P=0,F=0,J=0;pr.forEach(function(p){if(p.status==='P')P++;else if(p.status==='F')F++;else if(p.status==='J')J++;});
  var seq=0;for(var i=0;i<pr.length;i++){if(pr[i].status==='F')seq++;else break;}
  var ent=S.d.entregas.filter(function(e){return e.alunoId===a.id;});
  var lib=S.d.licoes.filter(function(l){return l.data<=hoje()&&l.conteudo&&l.conteudo.tarefa;}).length;
  var ac=0,tot=0;ent.forEach(function(e){ac+=+e.acertos||0;tot+=+e.total||0;});
  var seqP=0;for(var j=0;j<pr.length;j++){if(pr[j].status==='P')seqP++;else break;}
  return {P:P,F:F,J:J,reg:pr.length,freq:(P+F)?Math.round(P*100/(P+F)):null,seqFaltas:seq,seqPres:seqP,ultima:pr[0],entregas:ent.length,liberadas:lib,media:tot?Math.round(ac*100/tot):null};
}
function alertas(){

}

    '<div class="secao-t">Tarefas entregues</div>'+(ent.length?'<div class="lista">'+ent.map(function(e){var l=licaoPorId(e.licaoId)||{titulo:'?'};return '<div class="lin"><div class="info"><b>'+esc(l.semana+'. '+l.titulo)+'</b><span>'+e.acertos+'/'+e.total+' acertos'+(e.nota?' · '+'★'.repeat(+e.nota):'')+'</span></div><button class="btn sec peq" onclick="modalCorrigir(\''+e.id+'\')">Abrir</button></div>';}).join('')+'</div>':'<p class="muted peq">Nenhuma tarefa entregue.</p>'),

function enviarCodigo(id,para){var a=S.d.alunos.filter(function(x){return x.id===id;})[0];var v=varsAluno(a);if(para==='aluno')v.responsavel=primeiro(a.nome);abrirZap(para==='aluno'?a.whatsapp:a.whatsResp1,tpl(S.d.config.msgCodigo,v),{tipo:'codigo',alunoId:id});}
function novoCodigo(id){if(!confirm('Gerar um novo código? O código antigo deixará de funcionar.'))return;chamar('novoCodigoAluno',{id:id}).then(function(r){toast('Novo código: '+r.codigo);recarregar().then(function(){fichaAluno(id);});});}

/* ---------- Tarefas (correção) ---------- */

    (aba==='ult'&&ult?'<div class="card"><h3>'+esc(ult.titulo)+'</h3>'+listaEntregasLicao(ult)+'</div>':
    '<div class="card">'+(lista.length?'<div class="lista">'+lista.map(function(e){var a=S.d.alunos.filter(function(x){return x.id===e.alunoId;})[0]||{nome:'?'},l=licaoPorId(e.licaoId)||{titulo:'?'};
      return '<div class="lin">'+av(a.nome)+'<div class="info"><b>'+esc(a.nome)+'</b><span>Lição '+esc(l.semana)+' – '+esc(l.titulo)+' · '+e.acertos+'/'+e.total+' · '+esc(e.enviadoEm)+'</span></div>'+(e.situacao==='aguardando'?'<span class="chip alerta">corrigir</span>':'<span class="chip ok">ok</span>')+'<button class="btn sec peq" onclick="modalCorrigir(\''+e.id+'\')">Abrir</button></div>';}).join('')+'</div>':'<div class="vazio">'+ic('tarefas')+'<p>'+(aba==='corrigir'?'Nenhuma tarefa esperando correção.':'Nenhuma entrega ainda.')+'</p></div>')+'</div>');

function modalCorrigir(id){
  var e=S.d.entregas.filter(function(x){return x.id===id;})[0],a=S.d.alunos.filter(function(x){return x.id===e.alunoId;})[0]||{nome:'?'},l=licaoPorId(e.licaoId);
  var t=parseTarefa(l.conteudo.tarefa);
  S.notaSel=+e.nota||0;
  var corpo='<p class="muted">Lição '+l.semana+' – '+esc(l.titulo)+' · enviada em '+esc(e.enviadoEm)+'</p><p><span class="chip '+(e.acertos===e.total?'ok':'')+'">'+e.acertos+' de '+e.total+' acertos na múltipla escolha</span></p>'+
    t.questoes.map(function(q,i){var r=e.respostas[i];
      if(q.tipo==='mc')return '<div class="questao"><div class="en">'+(i+1)+'. '+esc(q.enunciado)+'</div>'+q.opcoes.map(function(o,j){var cl=j===q.correta?' certa':(+r===j?' errada':'');return '<div class="opcao'+cl+'">'+(+r===j?'● ':'○ ')+esc(o)+'</div>';}).join('')+'</div>';
      return '<div class="questao"><div class="en">'+(i+1)+'. '+esc(q.enunciado)+'</div><div class="card" style="background:var(--pri-claro);border:0;white-space:pre-wrap">'+esc(r||'(sem resposta)')+'</div></div>';}).join('')+
    '<div class="campo" style="margin-top:14px"><label>Avaliação</label><div class="estrelas" id="estrelas">'+[1,2,3,4,5].map(function(n){return '<button class="'+(n<=S.notaSel?'on':'')+'" onclick="S.notaSel='+n+';document.querySelectorAll(\'#estrelas button\').forEach(function(b,i){b.classList.toggle(\'on\',i<'+n+')})">★</button>';}).join('')+'</div></div>'+
    '<div class="campo"><label>Comentário para o aluno</label><textarea id="c-fb" placeholder="Ex.: Muito bem! Gostei da sua resposta sobre...">'+esc(e.feedback||'')+'</textarea></div>';
  abrirModal('Tarefa de '+esc(primeiro(a.nome)),corpo,
    (a.whatsapp||a.whatsResp1?'<button class="btn zap" style="margin-right:auto" onclick="zapFeedback(\''+id+'\')">'+ic('zap')+'Enviar comentário</button>':'')+
    '<button class="btn linha" onclick="fecharModal()">Fechar</button><button class="btn" onclick="salvarCorrecao(\''+id+'\')">Salvar correção</button>',true);
}
function zapFeedback(id){var e=S.d.entregas.filter(function(x){return x.id===id;})[0],a=S.d.alunos.filter(function(x){return x.id===e.alunoId;})[0],l=licaoPorId(e.licaoId);
  var est=S.notaSel?' '+'⭐'.repeat(S.notaSel):'';
  abrirZap(a.whatsapp||a.whatsResp1,'Oi, '+primeiro(a.nome)+'! Corrigi sua tarefa da lição "'+l.titulo+'".'+est+'\n\n'+val('c-fb'),{tipo:'feedback',alunoId:a.id});}
function salvarCorrecao(id){chamar('corrigirEntrega',{id:id,feedback:val('c-fb'),nota:S.notaSel||''}).then(function(){fecharModal();toast('Correção salva!');recarregar();});}

/* ---------- Progresso ---------- */
VIEWS.progresso=function(){
  var al=alunosAtivos(),ord=S.filtros.pOrd||'nome';
  var linhas=al.map(function(a){return {a:a,s:statsAluno(a)};});
  linhas.sort(function(x,y){if(ord==='freq')return (y.s.freq||0)-(x.s.freq||0);if(ord==='tarefas')return y.s.entregas-x.s.entregas;if(ord==='media')return (y.s.media||0)-(x.s.media||0);return x.a.nome.localeCompare(y.a.nome);});
  var fm=0,nf=0,mm=0,nm=0,te=0,tl=0;linhas.forEach(function(l){if(l.s.freq!=null){fm+=l.s.freq;nf++;}if(l.s.media!=null){mm+=l.s.media;nm++;}te+=l.s.entregas;tl+=l.s.liberadas;});
  var th=function(k,t){return '<th style="cursor:pointer" onclick="S.filtros.pOrd=\''+k+'\';render()">'+t+(ord===k?' ▾':'')+'</th>';};
  var porTri=[1,2,3,4].map(function(t){var ids=S.d.licoes.filter(function(l){return +l.trimestre===t;}).map(function(l){return l.id;});var reg=S.d.presenca.filter(function(p){return ids.indexOf(p.licaoId)>=0;});var P=reg.filter(function(p){return p.status==='P';}).length,F=reg.filter(function(p){return p.status==='F';}).length;return (P+F)?Math.round(P*100/(P+F)):null;});
  return topo('Progresso dos alunos','Frequência, tarefas entregues e aproveitamento nas questões')+
    '<div class="grade g4"><div class="card kpi"><span class="n">'+(nf?Math.round(fm/nf)+'%':'–')+'</span><span class="r">Frequência média</span></div><div class="card kpi"><span class="n">'+(tl?Math.round(te*100/tl)+'%':'–')+'</span><span class="r">Tarefas entregues</span></div><div class="card kpi"><span class="n">'+(nm?Math.round(mm/nm)+'%':'–')+'</span><span class="r">Acertos médios</span></div>'+
    '<div class="card kpi"><span class="r" style="margin-bottom:4px">Frequência por trimestre</span><div class="btns">'+porTri.map(function(v,i){return '<span class="chip '+(v==null?'cinza':v>=75?'ok':v>=50?'alerta':'perigo')+'">'+(i+1)+'º '+(v==null?'–':v+'%')+'</span>';}).join('')+'</div></div></div>'+
    '<div class="card rolagem-x" style="margin-top:14px"><table class="tab"><thead><tr>'+th('nome','Aluno')+th('freq','Frequência')+'<th>P / F / J</th>'+th('tarefas','Tarefas')+th('media','Acertos')+'<th>Situação</th></tr></thead><tbody>'+
    linhas.map(function(l){var s=l.s,sit=s.seqFaltas>=3?'<span class="chip perigo">Afastado</span>':s.seqFaltas>=1?'<span class="chip alerta">Atenção</span>':s.freq!=null&&s.freq>=85?'<span class="chip ok">Assíduo</span>':'<span class="chip cinza">Regular</span>';
      return '<tr style="cursor:pointer" onclick="fichaAluno(\''+l.a.id+'\')"><td><div style="display:flex;align-items:center;gap:8px">'+av(l.a.nome)+'<b>'+esc(l.a.nome)+'</b></div></td><td><div style="display:flex;align-items:center;gap:8px"><div class="progresso" style="width:80px"><i style="width:'+(s.freq||0)+'%;background:'+((s.freq||0)>=75?'var(--ok)':(s.freq||0)>=50?'var(--alerta)':'var(--perigo)')+'"></i></div>'+(s.freq!=null?s.freq+'%':'–')+'</div></td><td>'+s.P+' / '+s.F+' / '+s.J+'</td><td>'+s.entregas+'/'+s.liberadas+'</td><td>'+(s.media!=null?s.media+'%':'–')+'</td><td>'+sit+'</td></tr>';}).join('')+
    '</tbody></table>'+(linhas.length?'':'<div class="vazio">Cadastre alunos para acompanhar o progresso.</div>')+'</div>';
};

/* ---------- IA ---------- */
VIEWS.ia=function(){return topo('Pesquisa com IA','Assistente para preparar as aulas: contexto histórico, explicações, ilustrações, perguntas difíceis dos alunos e dinâmicas.')+painelIA(S.filtros.iaLic||'');};

function painelIA(licId){
  if(!S.d.config.temIA)return '<div class="card" style="border-left:5px solid var(--alerta)"><h3>IA ainda não ativada</h3><p>Para usar a pesquisa com IA, a coordenação precisa cadastrar uma chave gratuita do Google Gemini em <b>Configurações</b>. O guia de instalação explica o passo a passo.</p>'+(S.d.perfil==='coord'?'<button class="btn" onclick="ir(\'config\')">Ir para Configurações</button>':'')+'</div>';
  var l=licId?licaoPorId(licId):null;
  var sug=l?['Explique o contexto histórico de '+l.textoBase,'Dê 3 ilustrações do dia a dia de adolescentes para a lição "'+l.titulo+'"','Quais perguntas difíceis os alunos podem fazer sobre este tema? Sugira respostas.','Sugira uma dinâmica de 10 minutos, sem materiais, para "'+l.titulo+'"','Indique referências bíblicas cruzadas sobre este tema']:
    ['Qual o contexto histórico do livro de Daniel?','Como explicar a Trindade para adolescentes de 12 anos?','Sugira uma dinâmica de quebra-gelo para uma turma tímida','Como responder a um aluno que diz que a Bíblia é cheia de contradições?','Ideias de culto especial de Páscoa para pré-adolescentes'];
  return (licId?'':'<div class="campo"><label>Lição de referência (opcional)</label><select onchange="S.filtros.iaLic=this.value;render()"><option value="">Nenhuma – pergunta livre</option>'+S.d.licoes.map(function(x){return '<option value="'+x.id+'"'+(x.id===licId?' selected':'')+'>'+x.semana+'. '+esc(x.titulo)+'</option>';}).join('')+'</select></div>')+
    '<div class="card"><div class="campo"><label>Sua pergunta</label><textarea id="ia-perg" placeholder="Pergunte qualquer coisa para preparar sua aula..." onkeydown="if(event.key===\'Enter\'&&(event.ctrlKey||event.metaKey))perguntarIA(\''+(licId||'')+'\')"></textarea></div>'+
    '<div class="btns" style="margin-bottom:10px">'+sug.map(function(s){return '<button class="btn linha peq" onclick="document.getElementById(\'ia-perg\').value=this.textContent">'+esc(s)+'</button>';}).join('')+'</div>'+
    '<button class="btn" onclick="perguntarIA(\''+(licId||'')+'\')">'+ic('ia')+'Pesquisar</button></div><div id="ia-res"></div>';
}
function posIA(){var r=$('#ia-res');if(!r)return;r.innerHTML=S.iaHist.slice().reverse().map(function(h,i){return '<div class="card" style="margin-top:14px"><div class="btns" style="margin-bottom:6px"><b style="flex:1">'+esc(h.p)+'</b><button class="btn linha peq" onclick="copiar(S.iaHist['+(S.iaHist.length-1-i)+'].r)">'+ic('copiar')+'Copiar</button></div><div class="md">'+md(h.r)+'</div><p class="muted peq">Resposta gerada por IA – confira as referências bíblicas e informações antes de usar na aula.</p></div>';}).join('');}
function perguntarIA(licId){
  var p=val('ia-perg').trim();if(!p){toast('Escreva sua pergunta.',true);return;}
  chamar('pesquisaIA',{pergunta:p,licaoId:licId||''}).then(function(r){S.iaHist.push({p:p,r:r.texto});document.getElementById('ia-perg').value='';posIA();});
}

function meuAcesso(){
  var bio=ler('tt_bio'),ativo=bio&&bio.cred&&S.cred&&bio.cred.id===S.cred.id;
  var corpo='';
  if(S.d.perfil!=='aluno'){
    corpo+='<h3>Trocar meu PIN</h3><div class="grade g3"><div class="campo"><label>PIN atual</label><input type="password" inputmode="numeric" maxlength="6" id="mp-atual"></div><div class="campo"><label>Novo PIN</label><input type="password" inputmode="numeric" maxlength="6" id="mp-novo"></div><div class="campo"><label>Repita o novo PIN</label><input type="password" inputmode="numeric" maxlength="6" id="mp-novo2"></div></div><button class="btn" onclick="trocarPin()">Salvar novo PIN</button>';
  }
  corpo+='<h3 style="margin-top:24px">Entrar com a digital</h3><p class="muted peq">Use a digital (ou o reconhecimento facial) deste celular para abrir o app, sem digitar '+(S.d.perfil==='aluno'?'o código':'o PIN')+'. Vale só para este aparelho.</p><div id="bio-area"><p class="muted peq">Verificando se este aparelho tem leitor de digital...</p></div>';
  abrirModal('Meu acesso',corpo);
  bioDisponivel().then(function(ok){
    var a=document.getElementById('bio-area');if(!a)return;
    if(!ok){a.innerHTML='<div class="card" style="background:var(--alerta-claro);border:0">Este aparelho ou navegador não oferece entrada com digital para sites. Ela funciona no celular, abrindo o app pelo link do GitHub (com https) no Chrome ou no Safari.</div>';return;}
    a.innerHTML=ativo?'<p><span class="chip ok">✓ Digital ativada neste aparelho</span></p><button class="btn perigo" onclick="desativarDigital()">Desativar digital</button>':'<button class="btn" onclick="ativarDigital()">'+ic('digital')+'Ativar entrada com digital</button>';
  });
}
function trocarPin(){
  var a=val('mp-atual'),n=val('mp-novo'),n2=val('mp-novo2');
  if(n!==n2){toast('Os dois campos do novo PIN não são iguais.',true);return;}
  chamar('alterarMeuPin',{atual:a,novo:n}).then(function(r){
    S.cred=r.cred;guardar('tt_cred',r.cred);
    var bio=ler('tt_bio');if(bio&&bio.cred&&bio.cred.id===r.cred.id){bio.cred=r.cred;guardar('tt_bio',bio);}
    fecharModal();toast('PIN alterado com sucesso!');
  });
}
function b64(buf){var s='',b=new Uint8Array(buf);for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
function deB64(t){var s=atob(t),b=new Uint8Array(s.length);for(var i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b;}
function aleatorio(n){var b=new Uint8Array(n);crypto.getRandomValues(b);return b;}
function bioDisponivel(){
  try{
    if(!window.PublicKeyCredential||!navigator.credentials||(location.protocol!=='https:'&&location.hostname!=='localhost'))return Promise.resolve(false);
    return PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(function(){return false;});
  }catch(e){return Promise.resolve(false);}
}
function ativarDigital(){
  var nome=S.d.eu.nome||'Usuário';
  navigator.credentials.create({publicKey:{
    challenge:aleatorio(32),
    rp:{name:S.d.config.nomeApp||'Trilha Teen',id:location.hostname},
    user:{id:aleatorio(16),name:nome,displayName:nome},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},
    timeout:60000,attestation:'none'
  }}).then(function(c){
    guardar('tt_bio',{id:b64(c.rawId),cred:S.cred,nome:nome});
    fecharModal();toast('Digital ativada! Da próxima vez, é só tocar no leitor.');
  }).catch(function(e){toast('Não foi possível ativar a digital'+(e&&e.name==='NotAllowedError'?' (cancelado).':'.'),true);});
}
function desativarDigital(){guardar('tt_bio',null);fecharModal();toast('Digital desativada neste aparelho.');}
function entrarComDigital(){
  var bio=ler('tt_bio');if(!bio)return;
  navigator.credentials.get({publicKey:{challenge:aleatorio(32),rpId:location.hostname,allowCredentials:[{type:'public-key',id:deB64(bio.id)}],userVerification:'required',timeout:60000}})
    .then(function(){S.cred=bio.cred;guardar('tt_cred',bio.cred);S.desbloqueado=true;carregarTudo();})
    .catch(function(){toast('Digital não reconhecida. Tente de novo ou entre com '+(bio.cred.tipo==='aluno'?'o código':'o PIN')+'.',true);});
}

function tarefasAbertasAluno(){return S.d.licoes.filter(function(l){return l.tarefa&&l.tarefa.questoes.length&&!S.d.entregas.some(function(e){return e.licaoId===l.id;});});}
function minhaEntrega(lid){return S.d.entregas.filter(function(e){return e.licaoId===lid;})[0];}
function statsEu(){
  var pr=S.d.presenca.slice().sort(function(a,b){return a.data<b.data?1:-1;}),P=0,F=0;pr.forEach(function(p){if(p.status==='P')P++;if(p.status==='F')F++;});
  var seq=0;for(var i=0;i<pr.length;i++){if(pr[i].status==='P')seq++;else break;}
  var ac=0,tot=0,max=0;S.d.entregas.forEach(function(e){ac+=+e.acertos||0;tot+=+e.total||0;if(+e.total&&+e.acertos===+e.total)max++;});
  return {P:P,F:F,freq:(P+F)?Math.round(P*100/(P+F)):null,seq:seq,ent:S.d.entregas.length,media:tot?Math.round(ac*100/tot):null,max:max,estrelas:S.d.entregas.reduce(function(s,e){return s+(+e.nota||0);},0)};
}

VIEWS['a-licao-form']=function(l,e){
  var t=l.tarefa;
  var h='<button class="btn linha peq" onclick="delete minhaEntrega(\''+l.id+'\').__refazer;render()" style="margin-bottom:12px">'+ic('voltar')+'Cancelar edição</button><div class="card"><h3>Editar respostas – '+esc(l.titulo)+'</h3>'+
    t.questoes.map(function(q,i){var r=e.respostas[i];
      if(q.tipo==='mc')return '<div class="questao"><div class="en">'+(i+1)+'. '+esc(q.enunciado)+'</div>'+q.opcoes.map(function(o,j){return '<label class="opcao"><input type="radio" name="q'+i+'" value="'+j+'"'+(+r===j&&r!==''&&r!=null?' checked':'')+'> '+esc(o)+'</label>';}).join('')+'</div>';
      return '<div class="questao"><div class="en">'+(i+1)+'. '+esc(q.enunciado)+'</div><textarea id="q'+i+'">'+esc(r||'')+'</textarea></div>';}).join('')+
    '<button class="btn" style="width:100%;margin-top:12px;padding:14px" onclick="enviarTarefa(\''+l.id+'\')">Reenviar tarefa</button></div>';
  return h;
};
function enviarTarefa(lid){
  var l=S.d.licoes.filter(function(x){return x.id===lid;})[0],t=l.tarefa,resp=[],falta=0;
  t.questoes.forEach(function(q,i){
    if(q.tipo==='mc'){var m=document.querySelector('input[name="q'+i+'"]:checked');resp.push(m?+m.value:null);if(!m)falta++;}
    else{var v=val('q'+i).trim();resp.push(v);if(!v)falta++;}
  });
  if(falta&&!confirm('Você deixou '+falta+' pergunta(s) sem resposta. Enviar mesmo assim?'))return;
  chamar('enviarEntrega',{licaoId:lid,respostas:resp}).then(function(r){
    S.ultimoResultado={lid:lid,resp:resp,gabarito:r.gabarito,acertos:r.acertos,total:r.total};
    recarregar().then(function(){S.view='a-licao';S.param=lid;render();window.scrollTo(0,document.body.scrollHeight);});
  });
}

window.addEventListener('load',iniciar);
if(API_URL&&'serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
